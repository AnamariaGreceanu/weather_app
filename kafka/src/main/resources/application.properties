spring.application.name=kafka

kafka.consumer.auto-offset-reset=earliest

#Când trimi?i obiectul Java ca valoare, transform?-l în JSON.
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer


spring.kafka.consumer.properties.spring.json.trusted.packages=com.app.kafka
spring.kafka.consumer.properties.spring.json.value.default.type=com.app.kafka.classes.WeatherEvent

spring.datasource.url=jdbc:postgresql://localhost:5432/weather
spring.datasource.username=anamariagreceanu
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true